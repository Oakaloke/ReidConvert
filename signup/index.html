<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account | ReidConvert</title>
<meta name="description" content="Create a free ReidConvert account.">
<link rel="canonical" href="https://reidconvert.com/signup/">
<meta name="theme-color" content="#01295D">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<script>(function(){try{var s=localStorage.getItem("rc-theme");var d=s?s==="dark":matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/css/main.css">
<script defer src="/assets/js/config.js"></script>
<script defer src="/assets/js/tools.js"></script>
<script defer src="/assets/js/common.js"></script>
<script defer src="/assets/js/auth.js"></script>
</head>
<body>
<header id="site-header"></header>
<main id="main">
  <section class="section">
    <div class="container" style="max-width:440px">
      <h1 style="text-align:center">Create your account</h1>
      <p style="text-align:center;color:var(--muted)">Accounts are free. Membership (coming soon) unlocks bigger batches and larger files.</p>
      <div id="authNotice" class="cv-notice" hidden></div>
      <form id="authForm" class="auth-card" style="display:flex;flex-direction:column;gap:14px;margin-top:18px">
        <label class="cv-field-col">Email
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="cv-field-col">Password
          <input type="password" id="password" autocomplete="new-password" required minlength="6">
        </label>
        <button type="submit" class="btn btn-gold btn-lg" id="submitBtn">Create account</button>
        <button type="button" class="btn" id="googleBtn" hidden>Continue with Google</button>
        <p id="formMsg" role="status" aria-live="polite" style="min-height:1.2em;text-align:center"></p>
      </form>
      <p style="text-align:center;margin-top:16px">Already have an account? <a href="/login/">Log in</a></p>
      <p style="text-align:center;font-size:.9em;color:var(--muted)">By creating an account you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>.</p>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script>
(function () {
  function ready(fn){ if(document.readyState!=='loading') fn(); else document.addEventListener('DOMContentLoaded', fn); }
  ready(function () {
    var RC = window.RC; if (!RC) return;
    var form = document.getElementById('authForm'), notice = document.getElementById('authNotice'),
        msg = document.getElementById('formMsg'), submitBtn = document.getElementById('submitBtn'),
        googleBtn = document.getElementById('googleBtn');
    var CFG = window.RC_CONFIG || {};
    if (!RC.auth || !RC.auth.enabled()) {
      notice.hidden = false;
      notice.innerHTML = '<strong>Accounts are coming soon.</strong> You don’t need one — every ReidConvert tool is free to use right now with no sign-up.';
      form.style.opacity = '.5'; form.querySelectorAll('input,button').forEach(function (n) { n.disabled = true; });
      return;
    }
    if (CFG.GOOGLE_SIGN_IN) googleBtn.hidden = false;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      submitBtn.disabled = true; msg.textContent = 'Creating your account…';
      RC.auth.signUp(document.getElementById('email').value.trim(), document.getElementById('password').value)
        .then(function () { msg.textContent = 'Almost done! Check your email to confirm your account.'; })
        .catch(function (err) { submitBtn.disabled = false; msg.textContent = (err && err.message) || 'Could not create your account.'; });
    });
    googleBtn.addEventListener('click', function () { RC.auth.signInGoogle().catch(function (err) { msg.textContent = (err && err.message) || 'Google sign-in failed.'; }); });
  });
})();
</script>
</body>
</html>
